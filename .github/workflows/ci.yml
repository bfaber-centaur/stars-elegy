name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  speclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Fails on findings not in tools/speclint/baseline.txt; see that tool's
      # doc comment for -all and -write-baseline.
      - run: go run ./tools/speclint

  fleetlab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The fleetlab script hides javac errors; fail if any tool class is missing.
      - run: |
          export FLEETLAB_CACHE="$RUNNER_TEMP/fleetlab"
          tools/fleetlab/fleetlab >/dev/null 2>&1 || true
          for c in FleetLab CombatLab RaceLab; do test -f "$FLEETLAB_CACHE/build/$c.class"; done
      # CombatLab "computer" key: the AIX expert bytes, read back as b7= in the dump.
      - run: |
          export FLEETLAB_CACHE="$RUNNER_TEMP/fleetlab"
          tools/fleetlab/combatlab selftest | grep -qx 'combatlab selftest: ok'
      # CombatLab "target thing": waypoint 0 aims at a universe object (type 0x18).
      - run: |
          export FLEETLAB_CACHE="$RUNNER_TEMP/fleetlab"
          tools/fleetlab/combatlab parse experiments/ns/ns1.spec | diff tools/fleetlab/testdata/ns1.parse -
      # parse -wps: every waypoint block's bytes as build writes them. The old
      # specs' files were made with the CombatLab before "hi N" and "lay Y:W"
      # (pins byte-identity); wpnib and lm1 pin the nibble and the second word.
      - run: |
          export FLEETLAB_CACHE="$RUNNER_TEMP/fleetlab"
          for s in ob/ob002 ob/ob007 ob/ob014 ob/ob019 ns/ns1 cs003/cs003s tk/tk201 tk/tk301 tk/tk302 tk/tk503 wpnib/wpnib lm1/lm1; do
            tools/fleetlab/combatlab parse -wps experiments/$s.spec | diff tools/fleetlab/testdata/$(basename $s).wps - || exit 1
          done
